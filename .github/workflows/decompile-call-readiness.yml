name: iTell - decompile call readiness path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned JADX release
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
      - name: Decompile original and patched APK
        run: |
          set -euo pipefail
          JADX="$(find "$RUNNER_TEMP/jadx" -type f -path '*/bin/jadx' | head -n1)"
          test -x "$JADX"
          mkdir -p analysis/original analysis/build6
          "$JADX" --show-bad-code -j 2 -d analysis/original inputs/itell-1.4-b40-original.apk
          "$JADX" --show-bad-code -j 2 -d analysis/build6 /tmp/build6.apk
      - name: Extract call-readiness evidence
        run: |
          set -euo pipefail
          mkdir -p analysis/evidence
          find analysis/original/sources -type f \
            \( -name '*BridgeService*' -o -name '*CompanionCalls*' -o -name '*Shell*' -o -name '*MainActivity*' \) \
            -print > analysis/evidence/important-files.txt
          grep -RniE 'READY|NOT_READY|shellUp|shellState|callState|telephony|license|NO_LICENSE|NOT_PAIRED|PAIRED|hello_ok|pair_ok|call audio|service alive|openCall|openAcoustic|capabilit' \
            analysis/original/sources/com/itellapp/android \
            > analysis/evidence/call-readiness-hits.txt || true
          grep -RniE 'READY|NOT_READY|shellUp|shellState|callState|telephony|license|NO_LICENSE|NOT_PAIRED|PAIRED|hello_ok|pair_ok|call audio|service alive|openCall|openAcoustic|capabilit' \
            analysis/build6/sources/com/itellapp/android \
            > analysis/evidence/build6-call-readiness-hits.txt || true
          {
            echo "# iTell call readiness static analysis"
            echo
            echo "- Source APK SHA-256: $(sha256sum inputs/itell-1.4-b40-original.apk | cut -d' ' -f1)"
            echo "- Build #6 APK SHA-256: $(sha256sum /tmp/build6.apk | cut -d' ' -f1)"
            echo "- JADX: v1.5.7"
            echo "- Scope: BridgeService, CompanionCalls, Shell, MainActivity and READY/NOT_READY/license/telephony protocol state."
            echo "- This is static decompilation only; no runtime pairing or call test."
            echo
            echo "## Important files"
            cat analysis/evidence/important-files.txt
          } > analysis/evidence/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: itell-call-readiness-static-analysis
          path: |
            analysis/original/sources/com/itellapp/android/BridgeService.java
            analysis/original/sources/com/itellapp/android/call/CompanionCalls.java
            analysis/original/sources/com/itellapp/android/shell/
            analysis/original/sources/com/itellapp/android/MainActivity.java
            analysis/build6/sources/com/itellapp/android/BridgeService.java
            analysis/build6/sources/com/itellapp/android/call/CompanionCalls.java
            analysis/build6/sources/com/itellapp/android/shell/
            analysis/build6/sources/com/itellapp/android/MainActivity.java
            analysis/evidence/
          retention-days: 7
