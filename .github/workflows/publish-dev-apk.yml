name: Publish verified DEV APK to repository folder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dev-apk.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download verified Build #6 package from GitHub Actions
        uses: actions/download-artifact@v4
        with:
          name: itell-dev-package-6
          run-id: 45477969314
          github-token: ${{ github.token }}
          path: staging

      - name: Validate APK and stage in downloads folder
        shell: bash
        run: |
          set -euo pipefail
          test -s staging/itell-android-dev-untested.apk
          test -s staging/static-checks.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          checks = json.loads(Path('staging/static-checks.json').read_text())
          assert checks.get('resources_aligned') is True
          assert checks.get('dex_checksums_valid') is True
          assert checks.get('explicit_legacy_domain_literals_found') is False
          print('APK static checks:', checks)
          PY
          sha256sum staging/itell-android-dev-untested.apk
          mkdir -p downloads
          cp staging/itell-android-dev-untested.apk downloads/iTell-Android-DEV-Build-6-UNTESTED.apk
          printf '%s\n' "Build #6 — installed and launched via CI Android API 35 emulator." "NOT verified for iOS 1.3 pairing, telephony, or full runtime network safety." > downloads/BUILD-6-NOTES.txt

      - name: Commit verified package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads/iTell-Android-DEV-Build-6-UNTESTED.apk
          git add downloads/BUILD-6-NOTES.txt
          if git diff --cached --quiet; then
            echo "APK already present"
          else
            git commit -m "build: publish API35-install-verified DEV candidate #6"
            git push origin HEAD:main
          fi
