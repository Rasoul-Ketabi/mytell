name: iTell 1.6 Build49 - analyze Wireless Debugging on API30

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-wireless-api30.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned JADX release
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
      - name: Download the exact Build #6 CI artifact
        uses: actions/download-artifact@v4
        with:
          name: itell-16-b49-api30-dev-package-1
          run-id: 45878026164
          github-token: ${{ github.token }}
          path: staging
      - name: Decompile original and patched APK
        run: |
          set -euo pipefail
          JADX="$(find "$RUNNER_TEMP/jadx" -type f -path '*/bin/jadx' | head -n1)"
          test -x "$JADX"
          test -s staging/itell-android-16-b49-api30-dev-untested.apk
          mkdir -p analysis/original16 analysis/api30
          cp staging/itell-android-16-b49-api30-dev-untested.apk /tmp/api30.apk
          set +e
          "$JADX" --show-bad-code -j 2 -d analysis/original16 inputs/itell-1.6-49.apk
          ORIGINAL_RC=$?
          "$JADX" --show-bad-code -j 2 -d analysis/api30 /tmp/api30.apk
          BUILD6_RC=$?
          set -e
          if [ "$ORIGINAL_RC" -ne 0 ] && [ "$ORIGINAL_RC" -ne 3 ]; then exit "$ORIGINAL_RC"; fi
          if [ "$BUILD6_RC" -ne 0 ] && [ "$BUILD6_RC" -ne 3 ]; then exit "$BUILD6_RC"; fi
          test -d analysis/original16/sources
          test -d analysis/api30/sources
      - name: Extract call-readiness evidence
        run: |
          set -euo pipefail
          mkdir -p analysis/evidence
          find analysis/original16/sources -type f \
            \( -name '*BridgeService*' -o -name '*CompanionCalls*' -o -name '*Shell*' -o -name '*MainActivity*' \) \
            -print > analysis/evidence/important-files.txt
          grep -RniE 'READY|NOT_READY|shellUp|shellState|callState|telephony|license|NO_LICENSE|NOT_PAIRED|PAIRED|hello_ok|pair_ok|call audio|service alive|openCall|openAcoustic|capabilit' \
            analysis/original16/sources/com/itellapp/android \
            > analysis/evidence/call-readiness-hits.txt || true
          grep -RniE 'READY|NOT_READY|shellUp|shellState|callState|telephony|license|NO_LICENSE|NOT_PAIRED|PAIRED|hello_ok|pair_ok|call audio|service alive|openCall|openAcoustic|capabilit' \
            analysis/api30/sources/com/itellapp/android \
            > analysis/evidence/build6-call-readiness-hits.txt || true
          {
            echo "# iTell call readiness static analysis"
            echo
            echo "- Source APK SHA-256: $(sha256sum inputs/itell-1.6-49.apk | cut -d' ' -f1)"
            echo "- API 30 APK SHA-256: $(sha256sum /tmp/api30.apk | cut -d' ' -f1)"
            echo "- JADX: v1.5.7"
            echo "- Scope: BridgeService, CompanionCalls, Shell, MainActivity and READY/NOT_READY/license/telephony protocol state."
            echo "- This is static decompilation only; no runtime pairing or call test."
            echo
            echo "## Important files"
            cat analysis/evidence/important-files.txt
          } > analysis/evidence/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: itell-16-b49-wireless-api30-analysis
          path: |
            analysis/original16/sources/
            analysis/original16/resources/
            analysis/api30/sources/
            analysis/api30/resources/
            analysis/evidence/
          retention-days: 7
