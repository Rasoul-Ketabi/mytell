name: iTell Android - DEV recovery and install test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-dev.yml"
      - "scripts/**"
      - "inputs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itell-android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery source is available
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s inputs/itell-1.4-b40-original.apk ]; then
            echo "::error::Missing inputs/itell-1.4-b40-original.apk; upload the SHA-pinned original APK before running this workflow"
            exit 1
          fi
          echo "Original APK present; SHA256 is verified by recovery script."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0" "platform-tools"
      - name: Recover candidate from original (exact SHA required)
        run: |
          python3 scripts/prepare_dev_apk.py \
            --source inputs/itell-1.4-b40-original.apk \
            --output dist/unsigned.apk \
            --report dist/recovery-report.json
      - name: zipalign before signing
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f -v 4 dist/unsigned.apk dist/aligned.apk
          "$BT/zipalign" -c -P 16 -v 4 dist/aligned.apk
      - name: Generate one-run test signer (no signing secrets committed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/itell-dev"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/itell-dev/signer.p12" \
            -storepass "throwaway-dev-only" -keypass "throwaway-dev-only" \
            -alias itell-dev -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=iTell DEV Test,O=iTell,C=US"
          echo "::notice::This build uses an ephemeral signer; uninstall older iTell APK before testing."
      - name: Sign and validate APK with official Android tools
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/36.0.0"
          export SIGNPASS="throwaway-dev-only"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/itell-dev/signer.p12" --ks-type PKCS12 \
            --ks-key-alias itell-dev --ks-pass env:SIGNPASS --key-pass env:SIGNPASS \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out dist/itell-android-dev-untested.apk dist/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs \
            --min-sdk-version 31 dist/itell-android-dev-untested.apk \
            | tee dist/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 dist/itell-android-dev-untested.apk
          python3 scripts/verify_apk.py dist/itell-android-dev-untested.apk \
            | tee dist/static-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itell-dev-package-${{ github.run_number }}
          path: |
            dist/itell-android-dev-untested.apk
            dist/recovery-report.json
            dist/signature.txt
            dist/static-checks.json
          retention-days: 14
          if-no-files-found: warn

  emulator-install:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: itell-dev-package-${{ github.run_number }}
          path: dist
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android API 35 install and startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator_smoke.sh dist/itell-android-dev-untested.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itell-dev-install-diagnostics-${{ github.run_number }}
          path: smoke-logs/
          retention-days: 14
          if-no-files-found: warn
