name: iTell - repository safety preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure no private artifacts are tracked in a public repository
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          git ls-files > /tmp/tracked-itell.txt
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "Repository is PUBLIC. Recovery input and signed builds must not be committed."
            if grep -E -i '(^|/)[^/]+\.(apk|aab|apks|jks|keystore|p12|pfx|pem|key|mobileprovision)$' /tmp/tracked-itell.txt; then
              echo "::error::Private Android artifacts/keys tracked in public repository"
              exit 1
            fi
            echo "::notice::Safety preflight passed; packaging intentionally disabled until private."
          else
            echo "Repository is private; safe to stage reviewed recovery inputs in a separate commit."
            echo "No packaging job has been enabled in this bootstrap."
          fi
