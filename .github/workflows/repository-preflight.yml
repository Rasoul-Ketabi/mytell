name: iTell - repository safety preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure signing keys are absent from public repository
        shell: bash
        run: |
          set -euo pipefail
          git ls-files > /tmp/itell-tracked.txt
          if grep -Ei '(^|/)[^/]+\.(jks|keystore|p12|pfx|pem|key|mobileprovision)$' /tmp/itell-tracked.txt; then
            echo "::error::Private signing material must not be stored in Git"
            exit 1
          fi
          if grep -Ei '\.apk$' /tmp/itell-tracked.txt | grep -vFx -e 'inputs/itell-1.4-b40-original.apk' -e 'inputs/itell-1.6-49.apk' -e 'downloads/iTell-Android-DEV-Build-6-UNTESTED.apk' -e 'downloads/iTell-Android-1.6-b49-DEV-UNVERIFIED-PAIRING.apk' -e 'downloads/iTell-Android-1.6-b49-Android11-DEV-UNVERIFIED-PAIRING.apk' -e 'downloads/iTell-Android-1.6-B49-API30-TLS-FIX-DEV-UNVERIFIED-PAIRING.apk'; then
            echo "::error::Only the SHA-pinned historical recovery APK is permitted as a tracked APK"
            exit 1
          fi
          echo "Preflight OK. PUBLIC repository: do not upload signing secrets, tokens or personal data."
